<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Taste Embedding Recipes Chat" />
  <title>Taste Embedding Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header id="site-header">
    <div class="header-inner">
      <div class="header-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.5S2 11.5 2 13.5s1.75 3.75 1.75 3.75"/>
        </svg>
      </div>
      <h1 id="site-title">Taste Embedding Chat</h1>
      <p id="site-subtitle">Find your next meal using AI embeddings</p>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main id="main-content">
    
    <!-- Chat Section -->
    <section class="card" style="display: flex; flex-direction: column; height: 50vh; overflow-y: auto;" id="chat-container">
      <div id="chat-messages" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Messages go here -->
      </div>
      <div id="loading-indicator" class="loading hidden" style="margin-top: 1rem;">
        <div class="spinner" aria-hidden="true"></div>
        <span>Thinking...</span>
      </div>
    </section>

    <!-- Input Section -->
    <section class="card">
      <div id="example-prompts" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
        <button class="meta-chip example-prompt" style="cursor: pointer; border: none; font-family: inherit;">Something like a burger but vegetarian</button>
        <button class="meta-chip example-prompt" style="cursor: pointer; border: none; font-family: inherit;">Recipes similar to dosa</button>
        <button class="meta-chip example-prompt" style="cursor: pointer; border: none; font-family: inherit;">A light dessert with no baking</button>
        <button class="meta-chip example-prompt" style="cursor: pointer; border: none; font-family: inherit;">Quick lentil snack</button>
      </div>
      <form id="chat-form" autocomplete="off">
        <textarea
          id="question-input"
          placeholder="Ask for a recipe or tell me what ingredients you have..."
          rows="2"
          maxlength="500"
          aria-label="Enter your message"
        ></textarea>
        <div class="form-actions">
          <button type="button" id="new-chat-btn" class="meta-chip" style="cursor: pointer; border: none; font-family: inherit; background: var(--danger-bg); color: var(--danger);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            New Chat
          </button>
          <button type="submit" id="submit-btn">
            <span class="btn-text">Send</span>
            <span class="btn-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
              </svg>
            </span>
          </button>
        </div>
      </form>
      <p id="warning-msg" class="warning hidden" role="alert"></p>
    </section>

    <!-- Similar Search Section -->
    <section class="card" id="similar-section">
      <h2 class="section-title">
        <span class="section-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        Find Similar Recipe
      </h2>
      <form id="similar-form" autocomplete="off">
        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 0.75rem;">
          <input type="text" id="similar-name" placeholder="Recipe Name (e.g. Dosa)" style="width: 100%; border: 2px solid var(--sage-pale); border-radius: var(--radius-sm); padding: 0.85rem 1rem; font-family: inherit; background: var(--cream);" aria-label="Recipe Name" required />
          <input type="text" id="similar-ingredients" placeholder="Ingredients (comma separated)" style="width: 100%; border: 2px solid var(--sage-pale); border-radius: var(--radius-sm); padding: 0.85rem 1rem; font-family: inherit; background: var(--cream);" aria-label="Ingredients" required />
        </div>
        <div class="form-actions" style="justify-content: flex-end;">
          <button type="submit" id="similar-submit-btn" class="meta-chip" style="cursor: pointer; border: none; font-family: inherit; background: var(--forest); color: var(--white); padding: 0.65rem 1.35rem; border-radius: var(--radius-sm);">
            Search
          </button>
        </div>
      </form>
      <div id="similar-results" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer id="site-footer">
    <p>Taste Embedding Learning &mdash; Local Project</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
